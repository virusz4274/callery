name: Validate release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install verified scanner in the temporary runner directory
        env:
          SCANNER_DIR: ${{ runner.temp }}/gitleaks
        run: |
          mkdir -p "$SCANNER_DIR"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$SCANNER_DIR/scanner.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$SCANNER_DIR/scanner.tar.gz" | sha256sum --check
          tar -xzf "$SCANNER_DIR/scanner.tar.gz" -C "$SCANNER_DIR" gitleaks
      - name: Scan current source and retained history without printing credentials
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: node scripts/scan-secrets.mjs

  website:
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check and build the static website without deployment secrets
        run: |
          corepack enable pnpm
          corepack prepare pnpm@12.14.0 --activate
          pnpm install --frozen-lockfile
          pnpm website:check
          pnpm website:build

  acceptance:
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        billing: ['false', 'true']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the pinned package manager and lockfile dependencies
        run: |
          corepack enable pnpm
          corepack prepare pnpm@12.14.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Production Docker, real fixture services, browser and restore acceptance
        env:
          BILLING_PROFILE: ${{ matrix.billing }}
        run: |
          node scripts/ci-acceptance.mjs --billing="$BILLING_PROFILE" --checks

  workers-compatibility:
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned dependencies and verify shared Workers compatibility
        run: |
          corepack enable pnpm
          corepack prepare pnpm@12.14.0 --activate
          pnpm install --frozen-lockfile
          pnpm test:runtime
          pnpm build:runtimes --target=vinext

  source-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [secrets, website, acceptance, workers-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare a versioned source archive and draft release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Tag must match package.json version");'
          mkdir -p release-artifacts
          git archive --format=tar.gz --prefix="callery-$RELEASE_TAG/" HEAD > "release-artifacts/callery-$RELEASE_TAG.tar.gz"
          cd release-artifacts
          sha256sum "callery-$RELEASE_TAG.tar.gz" > SHA256SUMS
          gh release create "$RELEASE_TAG" "callery-$RELEASE_TAG.tar.gz" SHA256SUMS --draft --verify-tag --generate-notes
