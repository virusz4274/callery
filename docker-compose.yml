version: '3.8'

services:
  app:
    container_name: callery-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:3000"
    restart: always
    # Loads environment variables from the .env file
    env_file:
      - .env
    environment:
      # Uncomment this to use the bundled MongoDB container below instead of an external MongoDB instance.
      # MONGODB_URI: mongodb://mongo:27017/callery
      # Docker-first self-hosting defaults to the bundled MinIO service below.
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
      R2_BUCKET_NAME: callery
      R2_REGION: us-east-1
      R2_FORCE_PATH_STYLE: "true"
    depends_on:
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  mongo:
    container_name: callery-mongo
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    container_name: callery-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    container_name: callery-minio-init
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-change-me-minio-password}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb -p local/callery || true;
      exit 0;
      "
    restart: "no"

volumes:
  mongo_data:
  minio_data:
