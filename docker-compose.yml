services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ENABLE_BILLING: ${NEXT_PUBLIC_ENABLE_BILLING:-false}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_MARKETING_URL:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_REDIRECT_URI: ${NEXT_PUBLIC_GOOGLE_REDIRECT_URI:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_SHOW_MOBILE_BURGER_MENU: ${NEXT_PUBLIC_SHOW_MOBILE_BURGER_MENU:-false}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    restart: always
    # Lets the app reach host-run services (external MinIO, Ollama, Whisper)
    # via host.docker.internal on Linux; no-op on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Loads environment variables from the .env file
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_ENABLE_BILLING: ${NEXT_PUBLIC_ENABLE_BILLING:-false}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      db-init:
        condition: service_completed_successfully
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  cron:
    profiles: [selfhost, scheduler]
    image: alpine:3.23.6@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0
    restart: unless-stopped
    environment:
      TZ: UTC
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$$CRON_SECRET" ]; then
          echo "Set CRON_SECRET in .env to run exports, usage retries and cleanup."
          exit 1
        fi
        printf '%s\n' \
          '*/5 * * * * wget -qO- --header="Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/process-exports >/dev/null' \
          '*/5 * * * * wget -qO- --header="Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/process-usage >/dev/null' \
          '*/5 * * * * wget -qO- --header="Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/process-ingestion >/dev/null' \
          '0 3 * * * wget -qO- --header="Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/cleanup-recordings >/dev/null' \
          '0 8 * * * wget -qO- --header="Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/digest >/dev/null' \
          > /etc/crontabs/root
        exec crond -f -l 8

  db-init:
    profiles: [selfhost]
    build:
      context: .
      dockerfile: Dockerfile
      target: db-init
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  # Self-hosted MongoDB. Only starts with the selfhost profile:
  #   docker compose --profile selfhost up -d
  # then set MONGODB_URI=mongodb://mongo:27017/vosift in .env.
  # Without the profile, the app uses whatever MONGODB_URI points at
  # (usually a MongoDB Atlas cluster) and this service stays down.
  #
  # This mongo:8 service has no mongot search process. Vector search
  # ($vectorSearch) and full-text search ($search) require a search-enabled
  # MongoDB deployment and separately created Search indexes. db:init prints
  # their definitions but creates only ordinary indexes and seed data.
  # Here AI search can return keyword matches and ordinary search uses regex.
  # For vector search, use Atlas or separately configured self-managed mongot;
  # create recordings_vector_search on recordings (see docs/setup-guide.md).
  # recordings_text_search is optional for fuzzy API text search.
  mongo:
    profiles: [selfhost]
    image: mongo:8.0.34@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand({ ping: 1 }).ok !== 1) quit(1)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  # Bundled S3-compatible object storage (MinIO). Only starts with the
  # selfhost profile. The app reaches it at http://minio:9000 (R2_ENDPOINT);
  # browsers use S3_PUBLIC_ENDPOINT (http://localhost:9000). Credentials come
  # from R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY in .env, data persists in
  # the minio-data volume. Prefer R2 / AWS / an external MinIO instead?
  # Point R2_ENDPOINT (+ S3_PUBLIC_ENDPOINT) at that backend — the app
  # speaks plain S3. Root credentials come from the environment at startup;
  # recreate MinIO and app containers after changing them, preserving the
  # minio-data volume. Update external clients that use the old credentials.
  # NOTE: `pnpm run dev` also uses port 9000 — stop the dev server or remap
  # these ports before running both on one machine.
  minio:
    profiles: [selfhost]
    # Upstream community MinIO is archived and source-only. This optional
    # compatibility backend is built from its pinned security release.
    # Prefer a supported external S3 service for production; see docs/releases.md.
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID for bundled MinIO}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY for bundled MinIO}
    ports:
      - "${STORAGE_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${STORAGE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # One-shot: creates the R2_BUCKET_NAME bucket if missing, so the first
  # upload works on a fresh `compose --profile selfhost up`.
  minio-init:
    profiles: [selfhost]
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID for bundled MinIO}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY for bundled MinIO}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-vosift}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" >/dev/null
        mc mb --ignore-existing "local/$R2_BUCKET_NAME"
    restart: "no"

volumes:
  mongo-data:
  minio-data:
